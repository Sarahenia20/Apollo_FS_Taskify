version: '3.8'
services:
  db:
    image: mongo:4.2
    container_name: db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - 27017:27017
    volumes:
      - ./data/dump:/dump
      - mongo-data:/data/db
  app:
    build: .
    image: 192.168.33.10:8083/nodemongoapp:6.0
    restart: always
    container_name: back
    ports:
      - '5501:5501'  # Changé pour correspondre à votre PORT dans .env
      - '9090:9090'  # Ajouté pour votre SOCKETIO_PORT
    depends_on:
      - db
    environment:
      # Option 1: Utiliser la BD locale dans le conteneur Docker
      - MONGODB_URI=mongodb://root:example@db:27017/taskify?authSource=admin
      - PORT=5501
      - PRIVATE_KEY=515151511
      - SOCKETIO_PORT=9090
      - NODE_ENV=production
    volumes:
      - ./server:/app/server
      - ./client/build:/app/client/build
volumes:
  mongo-data: